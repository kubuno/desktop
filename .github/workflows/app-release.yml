name: app-release

# Builds the desktop shell. It is a native Win32 application (no web view, no
# bundler), so it builds on a Windows runner alone — the Tauri matrix that
# produced .deb/.msi/.dmg went away with Tauri itself. On a v* tag the exe is
# attached to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shell:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: build id needs the commit count

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        working-directory: windows
        run: cargo test -p kubuno-desktop

      - name: Build
        working-directory: windows
        run: cargo build --release -p kubuno-desktop

      # The MSIX wraps the exe; MakeAppx ships with the Windows SDK, which the
      # runner already has.
      - name: Package MSIX
        working-directory: windows/packaging
        run: pwsh ./package-msix.ps1 -ExePath ..\target\release\kubuno-desktop.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: 'Kubuno Desktop ${{ github.ref_name }}'
          draft: true
          files: |
            windows/target/release/kubuno-desktop.exe
            windows/packaging/Kubuno-Desktop.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
