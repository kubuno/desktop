[workspace]
resolver = "2"
members  = [
    "src/crates/kubuno-desktop-controls",
    "src/crates/kubuno-desktop-ui",
    "src/crates/kubuno-desktop-views",
    "src/crates/kubuno-desktop-views-macros",
    "src/crates/kubuno-desktop-views-meta",
    "src/crates/kubuno-desktop-views-ls",
    "src/crates/kubuno-desktop-views-syntax",
    "src/crates/kubuno-desktop-views-model",
    "src/crates/kubuno-web-views-compiler-core",
    "src/crates/kubuno-desktop-data",
    "src/crates/kubuno-desktop-data-model",
    "src/crates/kubuno-desktop-data-macros",
    "src/crates/kubuno-desktop-data-tool",
    "src/crates/kubuno-desktop-print",
    # The storage components (<Settings>, <SecretStore>, <RegistryKey>) over desktop/common's kubuno-desktop-app-storage
    # (vskubuno docs/STORAGE-COMPONENTS.md).
    "src/crates/kubuno-desktop-app-storage-components",
    "src/crates/kubuno-desktop-resources-model",
    "src/crates/kubuno-desktop-resources",
    "src/crates/kubuno-desktop-resources-macros",
    "src/crates/kubuno-desktop-resources-tool",
    "src/crates/kubuno-desktop",
    # The header menus (WaffleMenu, AccountMenu) every desktop app can place in its header.
    "src/crates/kubuno-desktop-shell-controls",
    # The header's data for the apps other than the shell, through the shell's token broker.
    "src/crates/kubuno-desktop-header-data",
    # The painting surface every control draws through (Canvas, Renderer, Theme, icons) and its helpers.
    # Ported from Files (MIT) as Drive's controls, they stay here, in the framework, now that the Drive app
    # lives in the drive repository (2026-10). The `kubuno-canvas` extraction (vskubuno DESKTOP-MIGRATION.md,
    # F5) will give them a framework name.
    "src/crates/kubuno-drive-desktop-app-controls",
    "src/crates/kubuno-drive-desktop-shared",
    "src/shell",
    "src/documents",
    # The module apps live in their module's repository (chat/desktop/windows, drive/desktop/windows, ...)
    # and depend on these crates by git tag (README.md, "Versions and tags").
]

[workspace.package]
version    = "0.1.0-alpha"
edition    = "2021"
license    = "AGPL-3.0-or-later"
repository = "https://github.com/kubuno/desktop"

# Shared dependency versions, used as `foo.workspace = true` (carried over from Drive's former
# workspace). The two crates ported from Files keep their own version and licence (MIT) in their
# manifests rather than inherit this workspace's.
[workspace.dependencies]
kubuno-drive-desktop-shared       = { path = "src/crates/kubuno-drive-desktop-shared" }
kubuno-drive-desktop-app-controls = { path = "src/crates/kubuno-drive-desktop-app-controls" }
kubuno-desktop-ui          = { path = "src/crates/kubuno-desktop-ui" }
kubuno-desktop-controls    = { path = "src/crates/kubuno-desktop-controls" }
kubuno-desktop-views       = { path = "src/crates/kubuno-desktop-views" }
kubuno-desktop-views-macros = { path = "src/crates/kubuno-desktop-views-macros" }
kubuno-desktop-views-meta   = { path = "src/crates/kubuno-desktop-views-meta" }
kubuno-desktop-views-syntax = { path = "src/crates/kubuno-desktop-views-syntax" }
kubuno-desktop-views-model  = { path = "src/crates/kubuno-desktop-views-model" }
kubuno-web-views-compiler-core    = { path = "src/crates/kubuno-web-views-compiler-core" }
kubuno-desktop-data         = { path = "src/crates/kubuno-desktop-data" }
kubuno-desktop-data-model   = { path = "src/crates/kubuno-desktop-data-model" }
kubuno-desktop-data-macros  = { path = "src/crates/kubuno-desktop-data-macros" }
kubuno-desktop-print        = { path = "src/crates/kubuno-desktop-print" }
kubuno-desktop-app-storage-components = { path = "src/crates/kubuno-desktop-app-storage-components" }
kubuno-desktop-resources-model  = { path = "src/crates/kubuno-desktop-resources-model" }
kubuno-desktop-resources        = { path = "src/crates/kubuno-desktop-resources" }
kubuno-desktop-resources-macros = { path = "src/crates/kubuno-desktop-resources-macros" }
kubuno-desktop              = { path = "src/crates/kubuno-desktop" }
kubuno-desktop-shell-controls     = { path = "src/crates/kubuno-desktop-shell-controls" }
kubuno-desktop-header-data        = { path = "src/crates/kubuno-desktop-header-data" }

windows          = { version = "0.62" }
windows-core     = { version = "0.62" }
thiserror        = "2"
crc32fast        = "1"
md-5             = "0.10"
sha1             = "0.10"
sha2             = "0.10"
hex              = "0.4"
chrono           = { version = "0.4", features = ["unstable-locales"] }
futures          = "0.3"
windows-numerics = "0.3"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["rt-multi-thread", "sync", "fs", "macros", "time", "io-util"] }
tracing          = "0.1"
tracing-subscriber = "0.3"

# Drive's former workspace built release with `lto = "thin"` and one codegen
# unit. Not carried over (yet): it was impossible while `kubuno-desktop-ui` was a shared
# DLL. Every program now links statically, so LTO would work again; it is left
# off to keep release builds short.
