[workspace]
resolver = "2"
members  = [
    "src/crates/kubuno-controls",
    "src/crates/kubuno-ui",
    "src/crates/kubuno-views",
    "src/crates/kubuno-views-macros",
    "src/crates/kubuno-views-meta",
    "src/crates/kubuno-views-ls",
    "src/crates/kubuno-views-syntax",
    "src/crates/kubuno-views-model",
    "src/crates/kubuno-views-web",
    "src/crates/kubuno-data",
    "src/crates/kubuno-data-model",
    "src/crates/kubuno-data-macros",
    "src/crates/kubuno-data-tool",
    "src/crates/kubuno-print",
    # The storage components (<Settings>, <SecretStore>, <RegistryKey>) over desktop/common's kubuno-app-storage
    # (vskubuno docs/STORAGE-COMPONENTS.md).
    "src/crates/kubuno-app-storage-components",
    "src/crates/kubuno-resources-model",
    "src/crates/kubuno-resources",
    "src/crates/kubuno-resources-macros",
    "src/crates/kubuno-resources-tool",
    "src/crates/kubuno",
    # The header menus (WaffleMenu, AccountMenu) every desktop app can place in its header.
    "src/crates/kubuno-shell-controls",
    # The header's data for the apps other than the shell, through the shell's token broker.
    "src/crates/kubuno-header-data",
    "src/shell",
    "src/chat",
    "src/documents",
    # Drive — the file manager and its crates. It used to be a workspace of its
    # own; it joined this one to build with the same framework crates as every
    # other app.
    "src/drive/crates/drive-shared",
    "src/drive/crates/drive-core-storage",
    "src/drive/crates/drive-app-storage",
    "src/drive/crates/drive-app-controls",
    "src/drive/crates/drive-app",
    "src/drive/crates/drive-localization",
]

[workspace.package]
version    = "0.1.0-alpha"
edition    = "2021"
license    = "AGPL-3.0-or-later"
repository = "https://github.com/kubuno/desktop"

# Shared dependency versions, used by the Drive crates as `foo.workspace = true`
# (carried over from Drive's former workspace). The Drive crates keep their own
# version and licence in their manifests rather than inherit this workspace's.
[workspace.dependencies]
drive-shared       = { path = "src/drive/crates/drive-shared" }
drive-core-storage = { path = "src/drive/crates/drive-core-storage" }
drive-app-storage  = { path = "src/drive/crates/drive-app-storage" }
drive-app-controls = { path = "src/drive/crates/drive-app-controls" }
drive-localization = { path = "src/drive/crates/drive-localization" }
kubuno-ui          = { path = "src/crates/kubuno-ui" }
kubuno-controls    = { path = "src/crates/kubuno-controls" }
kubuno-views       = { path = "src/crates/kubuno-views" }
kubuno-views-macros = { path = "src/crates/kubuno-views-macros" }
kubuno-views-meta   = { path = "src/crates/kubuno-views-meta" }
kubuno-views-syntax = { path = "src/crates/kubuno-views-syntax" }
kubuno-views-model  = { path = "src/crates/kubuno-views-model" }
kubuno-views-web    = { path = "src/crates/kubuno-views-web" }
kubuno-data         = { path = "src/crates/kubuno-data" }
kubuno-data-model   = { path = "src/crates/kubuno-data-model" }
kubuno-data-macros  = { path = "src/crates/kubuno-data-macros" }
kubuno-print        = { path = "src/crates/kubuno-print" }
kubuno-app-storage-components = { path = "src/crates/kubuno-app-storage-components" }
kubuno-resources-model  = { path = "src/crates/kubuno-resources-model" }
kubuno-resources        = { path = "src/crates/kubuno-resources" }
kubuno-resources-macros = { path = "src/crates/kubuno-resources-macros" }
kubuno              = { path = "src/crates/kubuno" }
kubuno-shell-controls     = { path = "src/crates/kubuno-shell-controls" }
kubuno-header-data        = { path = "src/crates/kubuno-header-data" }

windows          = { version = "0.62" }
windows-core     = { version = "0.62" }
thiserror        = "2"
crc32fast        = "1"
md-5             = "0.10"
sha1             = "0.10"
sha2             = "0.10"
hex              = "0.4"
chrono           = { version = "0.4", features = ["unstable-locales"] }
async-trait      = "0.1"
bitflags         = "2"
futures          = "0.3"
windows-numerics = "0.3"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["rt-multi-thread", "sync", "fs", "macros", "time", "io-util"] }
suppaftp         = { version = "10.0.2", default-features = false, features = ["tokio"] }
tracing          = "0.1"
tracing-subscriber = "0.3"
# LibGit2 bindings (Drive's git integration). `vendored` builds libgit2 with the crate.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# Drive's former workspace built release with `lto = "thin"` and one codegen
# unit. Not carried over (yet): it was impossible while `kubuno-ui` was a shared
# DLL. Every program now links statically, so LTO would work again; it is left
# off to keep release builds short.
