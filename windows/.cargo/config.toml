# No committed target-dir. It used to hardcode `C:\kubuno-build\desktop-target`
# — a path specific to one machine — which broke every other checkout and made
# the source tree hard to reason about.
#
# The reason it existed is real: the repo often lives on a network share (Z:),
# and the MSVC linker cannot reliably write a PDB there (LNK1201). The fix is to
# keep that choice PER MACHINE, out of the repo. On a machine that builds from a
# share, set it in your OWN environment, e.g. on Windows:
#
#   setx CARGO_TARGET_DIR C:\kubuno-build\desktop-target
#
# or in %USERPROFILE%\.cargo\config.toml. Everywhere else, the default local
# `target/` just works.

# ── Shared UI library ────────────────────────────────────────────────────────
# `kubuno-ui` is a Rust `dylib` (`kubuno_ui.dll`) shared by every app of this
# workspace. Linking against a Rust dylib requires the standard library to be
# dynamic as well — otherwise the exe and the DLL would each carry their own
# `std` and rustc refuses to link — hence `prefer-dynamic` for the whole
# workspace. At run time an exe therefore needs its `kubuno_ui-<hash>.dll` (each
# build of the DLL is named after itself and every exe imports the build it was
# linked against: `src/crates/kubuno-ui/build.rs`) and Rust's `std-*.dll` beside
# it: `tools/stage-runtime.ps1` copies them after a build, and
# `packaging/package-msix.ps1` ships them.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "prefer-dynamic"]
