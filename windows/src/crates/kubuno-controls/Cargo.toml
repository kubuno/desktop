[package]
name        = "kubuno-controls"
description = "Kubuno desktop control library: the WinForms control surface, reproduced natively on Direct2D."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
# The shared drawing surface, theme and text formats the Kubuno desktop apps
# already paint through. The control library adds a control MODEL on top; it
# never opens its own device or window.
drive-app-controls = { path = "../../drive/crates/drive-app-controls" }
# Matrix/vector types the Direct2D bindings take by value.
windows-numerics = "0.3"
# The diagnostics sink of a GUI application (`host::diagnostics`): a `tracing` subscriber and a
# `log` logger routed to the debugger's output or a log file.
tracing = { workspace = true }
log = "0.4"
# UI Automation: the accessibility tree a page publishes (`host::access`) is exposed to screen
# readers (Narrator, NVDA) through AccessKit's Windows adapter, which answers `WM_GETOBJECT`.
accesskit = "0.25"
# `#[implement]` (the OLE drag-and-drop objects of `host::dnd`) expands to `::windows_core` paths.
windows-core = { workspace = true }
accesskit_windows = "0.35"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    # `DXGI_FORMAT_B8G8R8A8_UNORM` — the pixel format a themed part is uploaded
    # in (`src/theme.rs`); it is the DIB's own byte order, so no swizzle.
    "Win32_Graphics_Dxgi_Common",
    # The host: a window class, its message loop, per-monitor DPI, and the
    # device-context plumbing the painter needs. Also the memory DC + top-down
    # DIB section `src/theme.rs` renders a themed part into.
    "Win32_Graphics_Gdi",
    # UxTheme: `OpenThemeData`, `DrawThemeBackground`, `IsAppThemed` and the
    # `BP_*`/`EP_*`/`PBS_*` part and state ids. This is what makes the library
    # match a machine with visual styles ON — see `src/theme.rs`.
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    # WIC (the renderer's bitmaps) is a COM object, so the host thread needs an
    # apartment before `Renderer::new` can succeed.
    "Win32_System_Com",
    # WIC decoding of an image held in memory (`styled::load_image_bytes`: an avatar or a picture
    # handed by the application as bytes). Already on through `drive-app-controls`.
    "Win32_Graphics_Imaging",
    # DirectWrite wants the locale a text format shapes for; the user's own is
    # what the toolkit measures with, so it is read rather than assumed.
    "Win32_Globalization",
    # `GetSystemMetricsForDpi` and `SystemParametersInfoForDpi` — the system
    # metrics and the UI font, asked for at the window's real DPI.
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # DWM caption tint (Windows 11+) — the host paints the system title bar
    # in the theme accent so a window reads as Kubuno without a full custom frame.
    "Win32_Graphics_Dwm",
    # High contrast (`styled::high_contrast`) and UI Automation (the accessibility tree the view
    # runtime publishes, through AccessKit).
    "Win32_UI_Accessibility",
    # Drag and drop (`host::dnd`): OLE's drop target, drop source and data object, the clipboard
    # formats and global memory they travel in, and the shell's file list (`CF_HDROP`).
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    # A floating panel's backdrop (`host::backdrop`): Windows.UI.Composition blurs what is behind
    # the window (a host backdrop brush) and clips it to the panel's own corner radius, under the
    # renderer's swap chain.
    "Win32_Graphics_Dxgi",
    "Foundation",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
]
