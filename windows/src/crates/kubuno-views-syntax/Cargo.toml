[package]
name        = "kubuno-views-syntax"
description = "The grammar of Kubuno .kbview views: a lossless rowan syntax tree and parser, the typed AST and element ids, surgical edits, the {Binding}/{Res} grammars, x:/d: markup, the .kbview/.kbcontrol file kinds and the registry-independent validator core. Platform-neutral (no UI, no Windows API): shared by the desktop runtime, the language server and the web compiler (WASM)."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# Platform-neutral on purpose (`vskubuno/docs/WEB-VIEWS.md` WV-1): it must keep building for
# `wasm32-unknown-unknown`, Linux and macOS. Never add a UI, Windows or C dependency here.
[dependencies]
# The lossless green/red syntax tree (rust-analyzer's own foundation), chosen per
# `vskubuno/docs/XML_VIEWS.md` §6: a tree that can be edited and re-serialised byte-identically.
rowan = "0.16"
# `PropKind` for the validator core (`validate`).
kubuno-views-model = { workspace = true }
