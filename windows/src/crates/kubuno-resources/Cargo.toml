[package]
name        = "kubuno-resources"
description = "Resources of Kubuno desktop applications (vskubuno docs/RESOURCES.md), the equivalent of Windows Forms' Resources.resx and Properties.Resources: resources!(\"resources.kbres\") generates a strongly typed, culture-aware class whose strings, images, icons, sounds, files, colours and fonts are embedded at compile time; a process-wide UI culture (following Windows' display language by default) with change notification, so `{Res key}` view properties refresh live."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
kubuno-resources-model  = { workspace = true }
kubuno-resources-macros = { workspace = true }
# The user's display language (GetUserPreferredUILanguages). Only features the UI crates already enable,
# so adding this crate does not change the `windows` build `kubuno_ui.dll` is linked with.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization"] }
tracing = { workspace = true }
