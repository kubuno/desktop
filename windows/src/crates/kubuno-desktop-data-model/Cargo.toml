[package]
name        = "kubuno-desktop-data-model"
description = "The data-source description of Kubuno desktop applications (vskubuno docs/DATA.md, DATA-4): the `.kbdata` format, provider names and the database-type to Rust-type mapping, shared by kubuno-desktop-data, its `data_source!` macro and the Visual Studio helper (kubuno-desktop-data-tool). No database driver, no UI: a plain library a proc macro can use."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
toml  = "1"
# The name of sqlx's offline cache file of a statement (`query-<sha256 hex>.json`).
sha2  = { workspace = true }
hex   = { workspace = true }
