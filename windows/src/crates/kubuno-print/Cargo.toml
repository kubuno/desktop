[package]
name        = "kubuno-print"
description = "The Windows Forms printing stack for Kubuno desktop applications (vskubuno docs/PRINTING.md): PrintDocument with BeginPrint / QueryPageSettings / PrintPage / EndPrint over the EVT-8 Graphics, PrinterSettings and PageSettings over the Windows spooler, PrintPreviewControl, PrintPreviewDialog, and the native PrintDialog and PageSetupDialog."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
# The component hierarchy, the registry (the Toolbox, the component tray), the `.kbview` runtime the
# preview dialog is built with, `Event<A>` and the args derive, and the view scope whose `.kbview`
# handlers a document raises its events to.
kubuno-views       = { workspace = true }
# `Graphics` (EVT-8): the page surface a `PrintPage` handler draws on.
kubuno-ui          = { workspace = true }
# The host (the preview dialog's window, `Painter`, `Visuals`, the themed parts) and `DialogResult`.
kubuno-controls    = { workspace = true }
# `Renderer` (a detached Direct2D device the pages are recorded on) and `Canvas`.
drive-app-controls = { workspace = true }
tracing            = { workspace = true }
thiserror          = { workspace = true }
windows-numerics   = { workspace = true }

# Direct2D printing (`ID2D1PrintControl` over an XPS print job) and COM streams. ONLY features the
# graph of `kubuno_ui.dll` already enables (drive-app-controls, kubuno-controls): a new feature on
# `windows` would change its metadata for every crate of the workspace, `kubuno_ui.dll` included.
# What `windows` hides behind other features (`IPrintDocumentPackageTargetFactory`,
# `ID2D1Device::CreatePrintControl`) is declared in `src/xps.rs` with `windows-core`'s `interface`.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
] }
windows-core = { workspace = true }
# The flat printing APIs (winspool: printers, DEVMODE, jobs; gdi32: page metrics; prntvpt: print
# tickets; comdlg32: the Print and Page Setup dialogs). `windows-sys` is not in `kubuno_ui.dll`'s
# graph, so its features change nothing there (the reason `kubuno-data` uses it too).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Graphics_Printing_PrintTicket",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# `LIBRARY_ELEMENTS`, the names `#[kubuno::view]` accepts for this crate's components (kept in sync by a test).
kubuno-views-meta = { workspace = true }
# `examples/view_embed.rs`: the designer surface the VSIX bundles, with the data components linked too.
kubuno-data       = { workspace = true }
# ... and the storage components (vskubuno docs/STORAGE-COMPONENTS.md).
kubuno-app-storage-components = { workspace = true }

# `examples/view_embed.rs` compiles kubuno-views' designer surface, whose `#[cfg(kubuno_design_project)]` is set by
# the Visual Studio design build only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kubuno_design_project)"] }
