[package]
name        = "kubuno-views-meta"
description = "The design-time attribute grammar of Kubuno custom controls and user controls (#[derive(Component)] / #[derive(UserControl)], vskubuno/docs/EVENTS.md EVT-7b), shared by the proc macros and the language server so both read a control's metadata the same way."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# `syn` with `full` parses both a derive input (the macros) and a whole source file (the
# language server's workspace scan). The versions are the ones this workspace already locks for
# `kubuno-views-macros` (no new download).
[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full"] }
