[package]
name        = "kubuno-views-macros"
description = "Procedural macros of kubuno-views: #[derive(EventArgs)] (EVT-1), #[event_handlers] typed handlers (EVT-4) and #[derive(Component)] control classes (EVT-7a), see vskubuno/docs/EVENTS.md."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
proc-macro = true

# Kept deliberately small (`vskubuno/docs/EVENTS.md` §8, "Compile time and
# rust-analyzer"): one crate, `syn` with its `full` feature (the `impl` blocks of
# `#[event_handlers]`), and generated code that is a plain trait `impl` and `match`
# rust-analyzer can navigate. The versions are the
# ones already locked by this workspace (no new download).
[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full"] }
# The attribute grammar of custom controls (EVT-7b), shared with the language server.
kubuno-views-meta = { workspace = true }

# The doc example of `#[derive(EventArgs)]` runs against the real traits
# (a dev-dependency cycle Cargo allows: tests only).
[dev-dependencies]
kubuno-views = { workspace = true }
