[package]
name        = "kubuno-desktop-resources-model"
description = "The resource-file format of Kubuno desktop applications (vskubuno docs/RESOURCES.md): `.kbres` files (strings, images, icons, audio, files, colours, fonts; linked or embedded; per-culture satellites), their canonical serialisation, culture fallback, generated names and the .resx/.resw import. No UI, no Windows API: a plain library shared by the runtime, the resources! macro, the language server and the conversion tool."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
# Embedded entries are base64 in the XML, like .resx (version already locked by this workspace).
base64 = "0.22"
