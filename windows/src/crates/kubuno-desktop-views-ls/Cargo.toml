[package]
name        = "kubuno-desktop-views-ls"
description = "LSP language server for Kubuno `.kbview` XML views: diagnostics, completion, hover, document symbols and go-to-definition, over the lossless kubuno-desktop-views syntax tree/registry."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "kubuno-views-ls"
path = "src/main.rs"

[dependencies]
# `lsp-server` + `lsp-types` (both rust-analyzer's own crates, split out of the
# rust-analyzer tree) rather than `tower-lsp`:
#
# - `vskubuno/docs/ARCHITECTURE.md` already hosts rust-analyzer itself over
#   `ILanguageClient` and explicitly frames future Rust/Kubuno tooling as
#   following the same model ("Already phase 3 of `docs/ARCHITECTURE.md`").
#   `lsp-server` is the exact scaffold rust-analyzer's own `main_loop` is built
#   on, so this crate's shape (a synchronous `Connection` with `Sender`/
#   `Receiver<Message>` channels) is a direct, well-understood precedent in
#   this codebase's own tooling story, not a new pattern to learn.
# - It is a thin, dependency-light transport: a JSON-RPC framer over stdio (or,
#   for tests, an in-memory channel pair via `Connection::memory()`) with no
#   opinion on how requests are dispatched. `tower-lsp` instead commits to an
#   async `tower::Service`/`async_trait` architecture (and a Tokio runtime) for
#   a server whose actual work here — reparsing a small `.kbview` file,
#   walking a `rowan` tree, scanning a registry slice — is synchronous and
#   CPU-bound, never I/O-bound; pulling in an async runtime would buy nothing
#   and would fight `kubuno-desktop-views`' own synchronous API (`syntax::parse`,
#   `validate::validate_with_default_registry` take `&str`/`&Parse`, return
#   plain values).
# - `Connection::memory()` is what makes the in-process round-trip test
#   harness (initialize → didOpen → completion/hover/diagnostics, no child
#   process, no stdio) straightforward: the server loop reads from one end,
#   the test drives the other, entirely inside `cargo test`.
lsp-server = "0.10"
lsp-types  = "0.97"
# `recv_timeout`'s error type: the main loop wakes up periodically to notice code-behind changes
# (EVT-5). Already in the lock file through `lsp-server`, whose `Connection` channels are these.
crossbeam-channel = "0.5"

serde      = { workspace = true }
serde_json = { workspace = true }

# `kubuno_desktop_views::syntax::Diagnostic::range` and every `ast` node's
# `text_range()` are `rowan::TextRange`s — this crate's own `Position`
# conversions and tree-walking helpers (`tree.rs`, `position.rs`) work in
# terms of the same `rowan::TextSize`/`TextRange`, so it needs the type
# directly rather than only through `kubuno-desktop-views`' re-exports (which only
# alias `SyntaxNode`/`SyntaxToken`, not the offset types themselves). Pinned
# to the same `0.16` `kubuno-desktop-views` uses.
rowan = "0.16"

# `lsp_types::Uri` (0.97 switched from `url::Url` to a minimal RFC 3986
# `fluent-uri`-backed type with no filesystem-path convenience methods) has
# no `to_file_path`/`from_file_path` of its own. `definition.rs`'s go-to-
# definition needs the directory of the open `.kbview` file to search sibling
# `.rs` files, so this crate pulls in `url` purely for its well-tested
# `Url::to_file_path`/`from_file_path` (Windows drive-letter handling
# included) and converts to/from `lsp_types::Uri` by their shared string
# representation (`crate::fs_uri`) rather than hand-rolling percent-decoding.
url = "2"

# The lossless syntax tree, typed `ast`, validator, component registry and
# (since work package DSG-2, `vskubuno/docs/DESIGNER.md`) the surgical `edit`
# API this server is built on (`vskubuno/docs/XML_VIEWS.md` §8, phase 3: "the
# same `rowan` AST + registry"). `kubuno-desktop-views` depends on `kubuno-desktop-ui`, never
# the reverse; this crate only ever reads `kubuno-desktop-views`' public API.
kubuno-desktop-views = { workspace = true }
# The `.kbres` format: `{Res key}` completion, hover, definition and diagnostics (vskubuno docs/RESOURCES.md).
kubuno-desktop-resources-model = { workspace = true }
# The attribute grammar of custom controls (EVT-7b): the project's `#[derive(Component)]` classes are
# read from their sources with the same parser the derive macros use (`src/project.rs`).
kubuno-desktop-views-meta = { workspace = true }
# The platform-neutral halves of `kubuno-desktop-views` (WV-1): the file-kind rules and the binding source
# schema types come from them directly, so a future web profile does not need the desktop runtime.
kubuno-desktop-views-syntax = { workspace = true }
kubuno-desktop-views-model  = { workspace = true }
# The web profile (vskubuno docs/WEB-VIEWS.md section 5, lot WV-7): `.kbview` / `.kbcontrol` files of a web project
# are validated by the web compiler itself (the same diagnostics, module isolation rule and generated `.d.ts` as
# `@kubuno/views-compiler`), against the JSON element registry of `@kubuno/ui` and the project's own registries.
kubuno-web-views-compiler-core = { workspace = true }
# The web code-behind is TypeScript: its class, methods, `@bind accessor` fields and imports are read with oxc's
# parser (spans only: every edit of a `.ts` file is an insertion or a name replacement, never a reprint).
oxc_allocator = "0.153"
oxc_ast       = "0.153"
oxc_parser    = "0.153"
oxc_span      = "0.153"

tracing           = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
