[package]
name    = "kubuno-desktop-ui"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "Kubuno's desktop design system, built on the WinForms control replicas."

# A plain Rust library (rlib), linked STATICALLY into every Kubuno desktop app:
# each exe carries its own copy of the design system and needs no DLL beside it.
# The global state the crate keeps (input queue, focus ring, floating surfaces)
# still exists exactly once per process, since a program links one copy of it.
# Product decision (2026-10-03): no shared Rust DLL, because the apps are
# released from their own repositories, each on its own schedule; Kubuno
# Desktop is a service dependency (token broker, sync, launcher), never a
# binary one.

[dependencies]
# The replica layer: property surface, defaults, state machines, layout engines.
kubuno-desktop-controls    = { path = "../kubuno-desktop-controls" }
# The painting surface every Kubuno app already draws through.
kubuno-drive-desktop-app-controls = { path = "../../drive/crates/kubuno-drive-desktop-app-controls" }
windows-numerics   = "0.3"
# Warnings of the drawing layer (an image that cannot be decoded).
tracing            = { workspace = true }
# The dock's layout (`dock::DockLayout`) is persisted as JSON, in the web's own shape.
serde              = { workspace = true }
serde_json         = { workspace = true }
# The splash screen (`splash`) publishes its product name, status line and progress to UI
# Automation (Narrator announces the status as a live region). Same versions as kubuno-desktop-controls.
accesskit          = "0.25"
accesskit_windows  = "0.35"

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    # The colour picker's rasters (`color::raster`) and its screen eyedropper.
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The splash screen (`splash`): its own layered window on its own thread, placed on the
    # launch monitor at that monitor's DPI, the process start time (time to first paint), the
    # per-user switch that turns it off, and the cloaked state of the window it waits for.
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
]
