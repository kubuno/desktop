[package]
name        = "kubuno-chat"
description = "Kubuno desktop chat — Windows Forms-like views (.kbview forms, .kbcontrol user controls), two-pane messaging"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library holds everything the Visual Studio designer must link to render the views: the
# `MessageThread` custom control, the user controls (`ConversationListPane`, `ConversationRow`,
# `ConversationPane`) and the main form (`ChatWindow`). The binary is the three-line `Program.cs`.
[lib]
name = "kubuno_chat"
path = "src/lib.rs"

[[bin]]
name = "kubuno-chat"
path = "src/main.rs"

[dependencies]
# The Kubuno desktop programming model (Application::run, #[kubuno::view], custom and user
# controls, resources) — it re-exports kubuno-views, kubuno-controls and kubuno-ui.
kubuno = { path = "../crates/kubuno" }
# The title bar's waffle and avatar (`ShowWaffle` / `ShowAccount` place the shared `HeaderActions`), and their
# data: the account's apps and favourites through the shell's token broker.
kubuno-shell-controls = { path = "../crates/kubuno-shell-controls" }
kubuno-header-data    = { path = "../crates/kubuno-header-data" }
# The HTTP client to the Kubuno core (`account_get_json`/`account_post_json`, the
# `/api/v1/chat/*` calls) with access tokens borrowed from the shell's broker.
kubuno-sync = { path = "../../../common/kubuno-sync" }
# Where the profile lives and whether this run may register `kubuno://` (not in a sandboxed profile).
kubuno-account = { path = "../../../common/kubuno-account" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Decodes the message envelope (base64url JSON `{text,…}`), the web's format.
base64      = "0.22"
# The error type kubuno-sync's API returns, propagated through the fetch layer.
anyhow      = "1"
# The realtime WebSocket to /api/v1/chat/ws (blocking, rustls — same as the sync
# engine's live channel), for live incoming messages.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Security",
]

[target.'cfg(windows)'.dependencies]
# Registers the `kubuno://` URL protocol under HKCU\Software\Classes, so the web
# can hand a meeting off to this desktop app — the same crate the shell uses.
winreg = "0.52"

[build-dependencies]
embed-manifest = "1.4"
winresource    = "0.1"
