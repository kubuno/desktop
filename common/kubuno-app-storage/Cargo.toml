[package]
name         = "kubuno-app-storage"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description  = "Where a Kubuno app keeps its data on the device (vskubuno docs/STORAGE-COMPONENTS.md): the per-user and machine directories (sandbox-aware), typed and versioned settings with change notifications over interchangeable back-ends (files on every OS, the Windows Registry, memory), app-scoped secrets over the OS credential store, and a Windows Registry API with WOW64 views. No UI: the views components live in kubuno-app-storage-components."

[features]
default = ["os"]
# The OS credential stores of `kubuno-secrets` (Credential Manager, Keychain, Secret Service). Without it only the
# in-memory and file secret stores exist (tests, tools).
os = ["kubuno-secrets/os"]

[dependencies]
kubuno-secrets = { path = "../kubuno-secrets", default-features = false }
serde_json = "1"
# The serde bridge (`settings::serde_bridge`): an app's existing settings struct stored field by field.
serde      = "1"
thiserror  = "2"
tracing    = "0.1"
sha2       = "0.10"
hex        = "0.4"

# Known folders (`SHGetKnownFolderPath`) and the Registry. `windows-sys` 0.61, like `kubuno-secrets` and `kubuno-account`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
serde    = { version = "1", features = ["derive"] }
