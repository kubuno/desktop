[package]
name         = "kubuno-api-client"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description  = "Typed asynchronous HTTP client of the Kubuno web API for the desktop: any method, per-request headers (If-Match, Idempotency-Key), access tokens from a token source (the shell's broker), cursor paging of the Kubuno Delta Protocol v1, retries with backoff and error classification."

[dependencies]
# rustls (not native-tls): uniform, OpenSSL-free TLS on Linux, Windows and macOS.
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio       = { version = "1", features = ["time", "sync"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tracing     = "0.1"
async-trait = "0.1"
sha2        = "0.10"
hex         = "0.4"
uuid        = { version = "1", features = ["v4"] }
getrandom   = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum  = "0.7"
