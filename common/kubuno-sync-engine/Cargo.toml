[package]
name         = "kubuno-sync-engine"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description  = "Offline-first data sync engine of the Kubuno desktop: per-account, per-app SQLite (SQLCipher) database with embedded migrations, outbox of intents with idempotency keys and explicit rollback, feeds pulled with the Kubuno Delta Protocol v1 (page + cursor in one transaction, rebase of pending changes), pluggable conflict policies, tombstones, scheduler hooks, sync status and change events, per-OS data directories."

[features]
default = ["sqlcipher"]
# Encrypt the local databases with SQLCipher (AES-256, key per account in the OS store). See
# `BUILD.md` (section "SQLCipher : prérequis de build") for the build requirements (Windows: a native Perl; macOS: nothing extra,
# CommonCrypto; Linux: perl + a C compiler, as for any OpenSSL build). Because cargo links one `libsqlite3-sys`
# per build, enabling it here also turns the SQLite of `rusqlite` users (kubuno-sync) into SQLCipher, which reads
# plain databases unchanged when no key is given.
sqlcipher = ["dep:libsqlite3-sys"]

[dependencies]
kubuno-api-client = { path = "../kubuno-api-client" }
kubuno-account    = { path = "../kubuno-account", default-features = false, features = ["client"] }
kubuno-secrets    = { path = "../kubuno-secrets", default-features = false }
sqlx       = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive"] }
tokio      = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tracing    = "0.1"
uuid       = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures    = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libsqlite3-sys = { version = "0.30.1", optional = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
libsqlite3-sys = { version = "0.30.1", optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
axum     = "0.7"
tempfile = "3"
# `sqlx::migrate!` for the tests' app migrations.
sqlx     = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
