[package]
name         = "kubuno-secrets"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description  = "OS credential store for Kubuno desktop secrets (refresh tokens, database keys): Windows Credential Manager, macOS Keychain, Linux Secret Service, plus an in-memory store for tests."

[features]
default = ["os"]
# The OS back-ends. Without it only `MemorySecretStore` and `FileSecretStore` exist (tests, tools).
os = ["dep:windows-sys", "dep:keyring"]

[dependencies]
thiserror = "2"
tracing   = "0.1"
zeroize   = { version = "1", features = ["derive"] }
hex       = "0.4"
getrandom = "0.2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: our own Credential Manager calls rather than `keyring`'s, because `keyring` writes
# `CRED_PERSIST_ENTERPRISE` credentials, which roam with a roaming profile: a refresh token copied to a second
# machine would be presented twice and revoke the whole token family on the server.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# macOS Keychain (generic passwords, legacy file keychain: device-local, never iCloud-synced).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", optional = true, default-features = false, features = ["apple-native"] }

# Linux and the BSDs: the freedesktop Secret Service over D-Bus (GNOME Keyring, KWallet), through `zbus`
# (pure Rust: no libdbus to link, cross-compiles from any host).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", optional = true, default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
