[package]
name         = "kubuno-account"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description  = "Kubuno desktop accounts: account identity (server + user id), account store, the token owner (refresh rotation, run by the shell only), the local token broker (named pipe / Unix socket; server for the shell, client for the apps), sign-in with TOTP, and the migration of the legacy plaintext creds.json into the OS credential store."

[features]
default = ["server", "client"]
# The shell side: TokenOwner + BrokerServer.
server = []
# The app side: BrokerClient + its TokenSource.
client = []

[dependencies]
kubuno-secrets    = { path = "../kubuno-secrets" }
# The per-user directories and the sandboxed profile (`paths`, re-exported unchanged).
kubuno-app-storage = { path = "../kubuno-app-storage" }
kubuno-api-client = { path = "../kubuno-api-client" }
tokio       = { version = "1", features = ["rt", "sync", "time", "io-util", "net", "macros", "fs"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tracing     = "0.1"
async-trait = "0.1"
sha2        = "0.10"
hex         = "0.4"
zeroize     = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
axum     = "0.7"
tempfile = "3"

# The test processes are spawned with SetErrorMode(SEM_FAILCRITICALERRORS) (no error dialog box on a CI or a
# shared desktop).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

# The tests run the shell side and the app side together.
[[test]]
name = "owner"
required-features = ["server", "client"]

[[test]]
name = "broker_ipc"
required-features = ["server", "client"]

# The shell side in its own process: this test binary is also the "shell" an app starts with `--background`
# (hence its own `main`: libtest would reject the shell's flags), and the squatter an app must refuse.
[[test]]
name = "shell_broker"
harness = false
required-features = ["server", "client"]
